{% extends 'base.html' %}

{% block content %}
<div style="background: #f8f9fa; display: flex; justify-content: center; align-items: center; min-height: 85vh; padding: 3rem 1rem; font-family: 'Montserrat', sans-serif;">
    <div style="background: #ffffff; border-radius: 12px; padding: 2.5rem; width: 100%; max-width: 550px; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);">
        
        <div style="text-align: center; margin-bottom: 2rem;">
            <h2 style="color: #1a1a1a; margin: 0 0 0.5rem 0; font-family: 'Cinzel', serif; font-size: 1.8rem; letter-spacing: 0.5px;">
                Compartir Receta
            </h2>
            <p style="color: #666; font-size: 0.95rem; margin: 0;">Introduce los detalles de tu creación culinaria</p>
            <div style="width: 50px; height: 3px; background: #bd1f24; margin: 1rem auto 0 auto; border-radius: 2px;"></div>
        </div>
        
        <form action="/registro" method="POST" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 1.4rem;">
            
            <div style="display: flex; gap: 1.2rem; flex-wrap: wrap;">
                <div style="display: flex; flex-direction: column; gap: 0.4rem; flex: 1; min-width: 200px;">
                    <label style="color: #333333; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;">Tu Nombre</label>
                    <input type="text" name="nombre_usuario" placeholder="Ej: Carlos" required
                           style="padding: 12px; background: #ffffff; color: #1a1a1a; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; outline: none; transition: border-color 0.2s;">
                </div>
                <div style="display: flex; flex-direction: column; gap: 0.4rem; flex: 1; min-width: 200px;">
                    <label style="color: #333333; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;">Tu Correo</label>
                    <input type="email" name="correo_usuario" placeholder="carlos@gourmet.com" required
                           style="padding: 12px; background: #ffffff; color: #1a1a1a; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; outline: none;">
                </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 0.4rem;">
                <label style="color: #333333; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;">Nombre de la Receta</label>
                <input type="text" name="nombre_receta" placeholder="Ej: Pasta Fettuccine a la Crema" required
                       style="padding: 12px; background: #ffffff; color: #1a1a1a; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; outline: none;">
            </div>

            <div style="display: flex; gap: 1.2rem; flex-wrap: wrap;">
                <div style="display: flex; flex-direction: column; gap: 0.4rem; flex: 1; min-width: 200px;">
                    <label style="color: #333333; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;">Categoría</label>
                    <select name="categoria" required
                            style="padding: 12px; background: #ffffff; color: #1a1a1a; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; cursor: pointer; outline: none;">
                        <option value="" disabled selected>-- Selecciona --</option>
                        <option value="masas">Masas / Pastas</option>
                        <option value="carnes">Carnes / Aves</option>
                        <option value="reposteria">Repostería / Postres</option>
                    </select>
                </div>

                <div style="display: flex; flex-direction: column; gap: 0.4rem; flex: 1; min-width: 200px;">
                    <label style="color: #333333; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;">Región Culinaria</label>
                    <select name="region" required
                            style="padding: 12px; background: #ffffff; color: #1a1a1a; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; cursor: pointer; outline: none;">
                        <option value="" disabled selected>-- Selecciona --</option>
                        <option value="japon">Japón / Asiática</option>
                        <option value="mexico">México / Latina</option>
                        <option value="china">China / Oriental</option>
                    </select>
                </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 0.4rem;">
                <label style="color: #333333; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;">Descripción y Pasos</label>
                <textarea name="descripcion" placeholder="Detalla brevemente los pasos y los ingredientes clave..." required rows="4"
                          style="padding: 12px; background: #ffffff; color: #1a1a1a; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; font-family: inherit; resize: vertical; outline: none; line-height: 1.5;"></textarea>
            </div>

            <div style="display: flex; flex-direction: column; gap: 0.4rem;">
                <label style="color: #333333; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;">Fotografía del Platillo</label>
                <input type="file" name="imagen" accept="image/*" required
                       style="padding: 8px 12px; background: #f1f5f9; color: #475569; border: 1px dashed #cbd5e1; border-radius: 6px; font-size: 0.9rem; cursor: pointer;">
            </div>

            <button type="submit" 
                    style="width: 100%; padding: 14px; background-color: #bd1f24; color: #ffffff; border: none; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 1px; margin-top: 0.5rem; transition: background-color 0.2s; box-shadow: 0 4px 12px rgba(189, 31, 36, 0.25);">
                Publicar en el Recetario
            </button>
        </form>
    </div>
</div>
{% endblock %}
